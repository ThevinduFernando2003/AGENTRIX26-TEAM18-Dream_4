name: CI

on:
  push:
    branches: [main, booking, viva-prep]
  pull_request:
    branches: [main, booking]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            project/requirements.txt
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Offline path — no cloud LLM keys in CI.
          LLM_PROVIDER: ""
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q --tb=short
