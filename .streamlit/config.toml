# MedBridge AI theme. Committed (see .gitignore) so the hosted demo is branded.
# Clean clinical palette: white cards/sidebar lifting off a soft slate canvas,
# with a calm medical teal for primary actions.

[theme]
primaryColor = "#0d9488"             # teal-600 — buttons, accents, progress
backgroundColor = "#f8fafc"          # slate-50 — soft clinical canvas
secondaryBackgroundColor = "#ffffff" # white — sidebar, cards, tables lift off the canvas
textColor = "#0f172a"                # slate-900
font = "sans serif"

[server]
# Keep uploads modest — the demo only ever ingests small report/prescription files.
maxUploadSize = 10
