# MedBridge AI theme. Committed (see .gitignore) so the hosted demo is branded.
# Refined further in the Phase 3 UI-polish pass.

[theme]
primaryColor = "#0d9488"            # teal-600 — buttons, accents, progress
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9" # slate-100 — sidebar, cards, tables
textColor = "#0f172a"               # slate-900
font = "sans serif"

[server]
# Keep uploads modest — the demo only ever ingests small report/prescription files.
maxUploadSize = 10
